<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terminal</title>
  <link rel="stylesheet" href="static/xterm.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
    }

    /* ── Terminal workspace ── */
    #workspace {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    /* ── Tab bar ── */
    #tab-bar {
      display: flex;
      align-items: center;
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4e;
      height: 34px;
      padding: 0 4px;
      gap: 2px;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    #tab-bar::-webkit-scrollbar { display: none; }

    .tab-btn {
      padding: 4px 14px;
      border: 1px solid transparent;
      background: transparent;
      color: #888;
      cursor: pointer;
      border-radius: 4px 4px 0 0;
      font-size: 12px;
      white-space: nowrap;
      transition: color .15s;
    }

    .tab-btn:hover { color: #ccc; }

    .tab-btn.active {
      background: #0d0d0d;
      color: #e0e0e0;
      border-color: #2a2a4e #2a2a4e transparent;
    }

    .tab-btn.ended { color: #555; }

    .tab-btn.has-activity:not(.active)::after {
      content: '●';
      font-size: 8px;
      margin-left: 5px;
      color: #e74c3c;
      vertical-align: middle;
    }

    #new-tab-btn {
      padding: 2px 10px;
      background: transparent;
      border: 1px solid #2a2a4e;
      color: #888;
      cursor: pointer;
      border-radius: 4px;
      font-size: 16px;
      line-height: 1;
      flex-shrink: 0;
      transition: color .15s, border-color .15s;
    }

    #new-tab-btn:hover {
      color: #e0e0e0;
      border-color: #555;
    }

    /* ── Terminal panes ── */
    #terminals {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .terminal-pane {
      position: absolute;
      inset: 0;
      padding: 4px;
      display: none;
    }

    .terminal-pane.active { display: block; }
  </style>
</head>
<body>

  <!-- Terminal workspace -->
  <div id="workspace">
    <div id="tab-bar">
      <!-- tabs inserted here dynamically -->
      <button id="new-tab-btn" title="New terminal">+</button>
    </div>
    <div id="terminals">
      <!-- terminal panes inserted here dynamically -->
    </div>
  </div>

  <script src="static/xterm.js"></script>
  <script src="static/xterm-addon-fit.js"></script>
  <script>
    // ── Path helpers ─────────────────────────────────────────────────────────
    // The terminal is served under a path prefix (e.g. /terminal/). Build API
    // and WebSocket URLs relative to the page so it works regardless of prefix.
    const basePath = location.pathname.replace(/\/[^/]*$/, '/'); // strip index file, keep trailing slash

    // ── Multi-tab terminal ───────────────────────────────────────────────────
    // sessions: name → { term, ws, fitAddon, pane, tabBtn, opened }
    const sessions  = {};
    let activeTab   = null;
    const tabBar    = document.getElementById('tab-bar');
    const newTabBtn = document.getElementById('new-tab-btn');
    const terminals = document.getElementById('terminals');

    const TERM_OPTS = {
      cursorBlink: true,
      fontSize: 14,
      fontFamily: '"Cascadia Code", "Fira Code", "JetBrains Mono", monospace',
      theme: {
        background: '#0d0d0d',
        foreground: '#e0e0e0',
        cursor:     '#e74c3c',
      },
    };

    function createTab(name) {
      if (sessions[name]) { activateTab(name); return; }

      // Pane
      const pane = document.createElement('div');
      pane.className = 'terminal-pane';
      terminals.appendChild(pane);

      // Tab button
      const tabBtn = document.createElement('button');
      tabBtn.className = 'tab-btn';
      tabBtn.textContent = name;
      tabBtn.addEventListener('click', () => activateTab(name));
      tabBar.insertBefore(tabBtn, newTabBtn);

      // xterm — opened lazily in activateTab so char dimensions are measured
      // against a visible element (term.open on a hidden pane gives 0-size chars).
      const term = new Terminal(TERM_OPTS);
      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);

      // Cmd+K on macOS, Ctrl+Shift+K on Win/Linux clears the terminal.
      // Avoids Ctrl+K alone since readline binds that to kill-to-end-of-line.
      term.attachCustomKeyEventHandler(e => {
        if (e.type !== 'keydown' || e.key.toLowerCase() !== 'k') return true;
        const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
        const match = isMac
          ? (e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey)
          : (e.ctrlKey && e.shiftKey && !e.metaKey && !e.altKey);
        if (!match) return true;
        term.clear();
        e.preventDefault();
        return false;
      });

      // WebSocket
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsURL = `${proto}//${location.host}${basePath}ws?session=${encodeURIComponent(name)}`;
      const ws = new WebSocket(wsURL);
      ws.binaryType = 'arraybuffer';

      ws.addEventListener('open', () => {
        if (pane.classList.contains('active') && sessions[name] && sessions[name].opened) {
          fitAddon.fit();
          sendResize(ws, term);
        }
      });

      ws.addEventListener('message', e => {
        const buf = new Uint8Array(e.data);
        if (buf[0] === 0x02) {
          term.write(buf.slice(1));
          // Flash the tab if it's not active.
          if (activeTab !== name) tabBtn.classList.add('has-activity');
        }
      });

      ws.addEventListener('close', () => {
        term.write('\r\n\x1b[90mSession ended.\x1b[0m\r\n');
        tabBtn.classList.add('ended');
      });

      ws.addEventListener('error', () => {
        term.write('\r\n\x1b[31mConnection error.\x1b[0m\r\n');
      });

      term.onData(data => {
        if (ws.readyState !== WebSocket.OPEN) return;
        const encoded = new TextEncoder().encode(data);
        const msg = new Uint8Array(1 + encoded.length);
        msg[0] = 0x00;
        msg.set(encoded, 1);
        ws.send(msg);
      });

      sessions[name] = { term, ws, fitAddon, pane, tabBtn, opened: false };

      // Only switch to the new tab if it was created by the user (+), not by
      // the background poll discovering a server-initiated session.
      if (activeTab === null) activateTab(name);
    }

    function activateTab(name) {
      const s = sessions[name];
      if (!s) return;

      // Hide all panes / deactivate all tabs
      Object.values(sessions).forEach(({ pane, tabBtn }) => {
        pane.classList.remove('active');
        tabBtn.classList.remove('active');
      });

      activeTab = name;
      s.pane.classList.add('active');
      s.tabBtn.classList.add('active');
      s.tabBtn.classList.remove('has-activity');

      // Open the xterm terminal now that the pane is visible so char dimensions
      // are measured correctly, then fit. Both are deferred one frame so the
      // browser has finished painting the pane at its final size first.
      requestAnimationFrame(() => {
        if (!s.opened) {
          s.term.open(s.pane);
          s.opened = true;
        }
        s.fitAddon.fit();
        sendResize(s.ws, s.term);
      });
    }

    function sendResize(ws, term) {
      if (ws.readyState !== WebSocket.OPEN) return;
      const msg = new Uint8Array(5);
      msg[0] = 0x01;
      const dv = new DataView(msg.buffer);
      dv.setUint16(1, term.cols, false);
      dv.setUint16(3, term.rows, false);
      ws.send(msg);
    }

    // New-tab button prompts for a name.
    newTabBtn.addEventListener('click', () => {
      const next = 'terminal-' + (Object.keys(sessions).length + 1);
      const name = prompt('Terminal name:', next);
      if (name && name.trim()) {
        createTab(name.trim());
        activateTab(name.trim());
      }
    });

    // Resize observer — re-fit & resize PTY when window changes.
    window.addEventListener('resize', () => {
      if (!activeTab) return;
      const s = sessions[activeTab];
      if (!s) return;
      s.fitAddon.fit();
      sendResize(s.ws, s.term);
    });

    // Poll the server for new sessions (created via a submitted command with a
    // new terminalId) and open tabs for them automatically.
    function pollSessions() {
      fetch(`${basePath}api/sessions`)
        .then(r => r.json())
        .then(data => {
          (data.sessions || []).forEach(name => {
            if (!sessions[name]) createTab(name);
          });
          if (data.activateSession) {
            if (!sessions[data.activateSession]) createTab(data.activateSession);
            activateTab(data.activateSession);
          }
        })
        .catch(() => {});
    }

    // Open the default session immediately, then poll every 2s for additional
    // server-initiated sessions.
    createTab('default');
    setInterval(pollSessions, 2000);
  </script>
</body>
</html>

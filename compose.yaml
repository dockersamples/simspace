# Local development for the whole platform — the static lab app AND the optional
# pulse backend (presence + analytics) — in one command:
#
#   docker compose up --build
#
#     app    → http://localhost:5173   (Vite dev server, hot-reloads app/ edits)
#     pulse  → http://localhost:8888   (presence + analytics API)
#
# This is for working ON this repo (app/ + pulse/). Lab AUTHORS don't need it —
# they use the prebuilt authoring image (see simspace-starter/compose.yaml).
#
# The two services don't talk to each other directly: the browser calls pulse,
# so both ports are published to the host. The committed app/public/config.json
# already points every lab at http://localhost:8888, so presence/analytics work
# out of the box here. A lab opts out with `tracking: false` in its labspace.yaml.

name: simspace

services:
  # The static lab app in dev mode (Vite + HMR). Built from the root Dockerfile's
  # `authoring` target (Node + app source), so node_modules comes from the image
  # and you need no local Node install. Edits reach the container through
  # `develop.watch` below — run `docker compose watch` (or `up --watch`) for live
  # editing.
  #
  # There is deliberately NO volume over node_modules. An anonymous one used to
  # sit here, from when app/ was bind-mounted and the mount would otherwise have
  # hidden the image's modules. `develop.watch` replaced that bind mount and
  # ignores node_modules, so the volume protected nothing — but Compose reattaches
  # an anonymous volume to the recreated container, so it kept serving a
  # node_modules from before the dependency graph changed. Adding the labspace
  # workspace made that concrete: `up --build` produced a correct image and Vite
  # still failed to resolve @dockersamples/simspace-labspace, because the stale
  # volume had no symlink for it.
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: authoring
    command: npm run dev
    ports:
      - "5173:5173"
    develop:
      watch:
        - path: ./app
          action: sync
          target: /usr/local/app
          ignore:
            - node_modules
            - dist
        # A manifest change means the dependency graph moved, which a file sync
        # can't reproduce — the image has to be rebuilt and node_modules
        # recreated. That includes the workspace packages under packages/, not
        # just the app's own manifest.
        - path: ./app/package.json
          action: rebuild
        - path: ./app/packages/simulator/package.json
          action: rebuild
        - path: ./app/packages/labspace/package.json
          action: rebuild

  # The presence + analytics backend. Built from pulse/Dockerfile's `dev` target
  # (toolchain + dev deps + source). src/ and scripts/ are mounted so a
  # `docker compose restart pulse` rebuilds from your edits; the SQLite log
  # persists in a named volume.
  pulse:
    build:
      context: ./pulse
      target: dev
    command: npm run dev
    ports:
      - "8888:8888"
    environment:
      PORT: "8888"
      DB_PATH: "/data/pulse.db"
      PRESENCE_TTL_MS: "30000"
      # Enables the instructor-only /stats endpoint (and the in-app dashboard).
      # Override with `PULSE_STATS_TOKEN=… docker compose up`.
      STATS_TOKEN: "${PULSE_STATS_TOKEN:-dev-token}"
    volumes:
      - ./pulse/src:/app/src
      - ./pulse/scripts:/app/scripts
      - pulse-data:/data

volumes:
  pulse-data:

name: Publish the Simspace kit

# Publishes kit/ as an OCI artifact to docker.io/dockersamples/simspace-authoring-kit —
# the authoring skills and agent guidance a Simspace lab repo consumes through
# its .sbxenv.yaml. This is NOT an image; the two Simspace images are built by
# build-images.yml, and this workflow pushes no container.
#
# The kit exists so the skills stop ageing with the repo that vendored them: a
# lab repo generated a year ago resolves this artifact fresh on every
# `sbx env run`, so it authors against today's format rather than the format as
# it stood the day the repo was created. That only holds if the rolling tag
# actually tracks main — hence publishing on every push that touches kit/.
#
# Tagging mirrors what a consumer can pin:
#
#   push to main         -> <YYYYMMDD>-<sha>, and `latest` re-points at it
#   push tag kit/vX.Y.Z  -> vX.Y.Z, nothing moves
#   manual dispatch      -> <YYYYMMDD>-<sha>, and `latest` re-points at it
#   pull request         -> validated and planned, published nowhere
#
# Date first so lexicographic order is chronological — tag listings sort as
# strings, and a hash-first tag sorts randomly. There is deliberately no bare
# <sha> or bare <date> tag: either would be mutable in practice, which is the
# opposite of what pinning is for.

on:
  push:
    branches: [main]
    tags: ["kit/v*"]
  pull_request:
    paths:
      - "kit/**"
      - "scripts/publish-kit.sh"
      - ".github/workflows/publish-kit.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for the Docker Hub OIDC token exchange

env:
  REGISTRY: docker.io
  NAMESPACE: dockersamples
  # Publish for real only from this repository and off a pull request. Otherwise
  # the script validates, resolves and reports without touching the registry —
  # which is what makes the pull-request run worth having.
  DRY_RUN: >-
    ${{ (github.event_name == 'pull_request'
      || github.repository != 'dockersamples/simspace') && '1' || '' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Enough history for the change check below to diff the pushed range.
          fetch-depth: 0

      - name: Resolve the tag to publish
        id: plan
        # Deciding here rather than with an `on.push.paths` filter, because a
        # path filter would also apply to the release tags this workflow listens
        # for — and a `kit/vX.Y.Z` tag is usually cut on a commit that changed
        # nothing under kit/, so the release would silently never run. The check
        # is therefore scoped to branch pushes, where it is the only thing
        # stopping every unrelated push to main from re-publishing the kit.
        run: |
          set -euo pipefail

          case "${GITHUB_REF}" in
            refs/tags/kit/v*)
              # A named version. Nothing rolls: `latest` follows main, which is
              # the tip every change is validated against, while a version is a
              # fixed point someone chose to pin.
              tag="${GITHUB_REF#refs/tags/kit/}"
              move_latest=false
              skip=false
              ;;
            *)
              tag="$(date -u +%Y%m%d)-${GITHUB_SHA}"
              move_latest=true
              skip=false
              if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
                before="${{ github.event.before }}"
                # All-zeros means the branch is new to the remote and there is no
                # range to diff — publish rather than guess.
                if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
                  echo "no diff base — publishing"
                elif git diff --quiet "$before" "$GITHUB_SHA" -- \
                       kit scripts/publish-kit.sh .github/workflows/publish-kit.yml; then
                  echo "nothing under kit/ or its publish plumbing changed — skipping"
                  skip=true
                fi
              fi
              ;;
          esac

          {
            echo "tag=${tag}"
            echo "move-latest=${move_latest}"
            echo "skip=${skip}"
          } >> "$GITHUB_OUTPUT"

          echo "tag=${tag} move-latest=${move_latest} skip=${skip}"

      - name: Install sbx
        if: steps.plan.outputs.skip != 'true'
        # `sbx kit` is daemon-free — only `kit add` needs sandboxd — so a plain
        # runner with no VM and no KVM is enough. Kit spec v2 landed in v0.38.0,
        # so the latest stable release can read kit/spec.yaml; no nightly needed.
        run: |
          set -euo pipefail
          version=$(gh api repos/docker/sbx-releases/releases/latest --jq .tag_name)
          echo "installing sbx ${version}"
          tmp=$(mktemp -d)
          gh release download "$version" \
            --repo docker/sbx-releases \
            --pattern DockerSandboxes-linux-amd64.tar.gz \
            --dir "$tmp"
          tar xzf "$tmp/DockerSandboxes-linux-amd64.tar.gz" -C "$tmp"
          # The installer runs under sudo, so create the parent unprivileged
          # first: if ~/.docker is absent it would be created root-owned, and the
          # docker login below then cannot write config.json into it — the only
          # credential `sbx kit push` and `oras` read. That failure would land a
          # long way from its cause.
          mkdir -p "$HOME/.docker"
          sudo PREFIX="$HOME/.docker/sbx" "$tmp/docker-sbx/install.sh"
          echo "$HOME/.docker/sbx/bin" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (OIDC)
        if: steps.plan.outputs.skip != 'true' && env.DRY_RUN == ''
        # Keyless, the same connection build-images.yml uses: the id-token
        # permission lets the action exchange a GitHub OIDC token for a
        # short-lived Docker Hub token, so there is no PAT to leak or rotate.
        # This populates the Docker credential store, which is what both
        # `sbx kit push` and oras read.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: 80de9e44-46f6-4c48-96a5-e0bd0a336f5b
        with:
          username: dockersamples

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        if: steps.plan.outputs.skip != 'true' && env.DRY_RUN == ''
        # Needed whenever anything is published, not only when the rolling tag
        # moves: the existence probe and the digest read-back both use oras.
        with:
          version: "1.3.3"

      - name: Publish
        if: steps.plan.outputs.skip != 'true'
        id: publish
        run: ./scripts/publish-kit.sh "${{ steps.plan.outputs.tag }}" >> "$GITHUB_OUTPUT"
        env:
          MOVE_LATEST: ${{ steps.plan.outputs.move-latest }}

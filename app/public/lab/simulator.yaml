version: "2.0"

metadata:
  id: getting-started
  title: "Getting Started"
  summary: "Run a simulated container and edit a file — no Docker required."
  authors: ["Docker Samples"]

state:
  container:
    running: false
  network:
    enabled: false
  signing:
    configured: false
  phase: start

controls:
  - id: network-access
    label: "Enable network access"
    description: "Allow the simulated container to answer curl requests."
    state: network.enabled
    enabled: true
    disabled: false
  - id: signing-key
    label: "Configure image signing key"
    description: "Provide the CI pipeline with a cosign key so it can sign images."
    state: signing.configured
    enabled: true
    disabled: false

# Reusable CI workflow definitions. A scenario triggers one with `then.ci`,
# which resolves the workflow into a run shown in the CI tab. Each step's `logs`
# are the condensed, teaching-focused output (not a full build log).
workflows:
  - id: build-and-sign
    name: "Build and Sign"
    on: push
    steps:
      - id: checkout
        name: "Check out repository"
        logs:
          - "$ git checkout $GITHUB_SHA"
          - "HEAD is now at a1b2c3d Add signing workflow"
      - id: build
        name: "Build image"
        logs:
          - "$ docker build -t registry.example.com/app:latest ."
          - "=> exporting to image ... done"
          - "=> => writing image sha256:9f8e7d6c ... done"
      - id: sign
        name: "Sign image with cosign"
        logs:
          - "$ cosign sign registry.example.com/app@sha256:9f8e7d6c"
          - "Pushed signature to registry.example.com/app"
      - id: verify
        name: "Verify signature policy"
        logs:
          - "$ cosign verify registry.example.com/app@sha256:9f8e7d6c"
          - "Verified OK — signature matches the expected identity."

defaults:
  unmatched:
    stderr: ["Error: that command isn't part of this lab yet."]
    exit: 1
  unmatchedAgent:
    output:
      - "I can only respond to the prompts this lab has scripted. Try asking me"
      - 'to "scaffold the app".'

scenarios:
  - id: run-start
    when:
      command: [docker, run]
      state: { container.running: false }
    then:
      state:
        container.running: true
        phase: running
      output:
        - "Unable to find image 'nginx:latest' locally"
        - "latest: Pulling from library/nginx"
        - "Status: Downloaded newer image for nginx:latest"
        - "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"

  - id: run-already
    when:
      command: [docker, run]
      state: { container.running: true }
    then:
      stderr: ["docker: a container named web is already running."]
      exit: 1

  - id: ps-running
    when:
      command: [docker, ps]
      state: { container.running: true }
    then:
      output:
        - "CONTAINER ID   IMAGE     STATUS         PORTS                NAMES"
        - "a1b2c3d4e5f6   nginx     Up 3 seconds   0.0.0.0:8080->80/tcp web"

  - id: ps-empty
    when:
      command: [docker, ps]
    then:
      output:
        - "CONTAINER ID   IMAGE     STATUS    PORTS     NAMES"

  - id: stop
    when:
      command: [docker, stop]
      state: { container.running: true }
    then:
      state:
        container.running: false
        phase: stopped
      output:
        - "web"

  # curl is gated by the network-access toggle (set via the Settings button).
  # The toggle writes shared state, so enabling it in one terminal unblocks
  # curl in every terminal.
  - id: curl-allowed
    when:
      command: curl
      state: { network.enabled: true }
    then:
      output:
        - |
          <!DOCTYPE html>
          <html>
          <head>
          <title>Welcome to nginx!</title>
          <style>
          html { color-scheme: light dark; }
          body { width: 35em; margin: 0 auto;
          font-family: Tahoma, Verdana, Arial, sans-serif; }
          </style>
          </head>
          <body>
          <h1>Welcome to nginx!</h1>
          <p>If you see this page, nginx is successfully installed and working.
          Further configuration is required for the web server, reverse proxy, 
          API gateway, load balancer, content cache, or other features.</p>

          <p>For online documentation and support please refer to
          <a href="https://nginx.org/">nginx.org</a>.<br/>
          To engage with the community please visit
          <a href="https://community.nginx.org/">community.nginx.org</a>.<br/>
          For enterprise grade support, professional services, additional 
          security features and capabilities please refer to
          <a href="https://f5.com/nginx">f5.com/nginx</a>.</p>

          <p><em>Thank you for using nginx.</em></p>
          </body>
          </html>

  - id: curl-blocked
    when:
      command: curl
    then:
      stderr: ["curl: (7) Failed to connect: blocked by network policy."]
      exit: 7

  # ── Git + CI ────────────────────────────────────────────────────────────────
  # A commit, for flavor, so the push has something to send.
  - id: git-commit
    when:
      command: [git, commit]
    then:
      output:
        - "[main a1b2c3d] Add signing workflow"
        - " 1 file changed, 24 insertions(+)"

  # First push: the signing key isn't configured, so the pipeline fails at the
  # sign step. `then.ci` triggers the Build and Sign workflow with a failure.
  - id: git-push-unsigned
    when:
      command: [git, push]
      state: { signing.configured: false }
    then:
      output:
        - "Enumerating objects: 5, done."
        - "To github.com:acme/app.git"
        - "   a1b2c3d..e4f5a6b  main -> main"
      ci:
        workflow: build-and-sign
        commit: "Add signing workflow"
        conclusion: failure
        failedStep: sign
        steps:
          - id: sign
            logs:
              - "$ cosign sign registry.example.com/app@sha256:9f8e7d6c"
              - "Error: no signing key configured (COSIGN_KEY is unset)"
        error: "Image signing failed — no signing key is configured. Add a cosign key and push again."

  # Second push: with the key configured, the same workflow runs green.
  - id: git-push-signed
    when:
      command: [git, push]
      state: { signing.configured: true }
    then:
      output:
        - "Enumerating objects: 5, done."
        - "To github.com:acme/app.git"
        - "   e4f5a6b..c7d8e9f  main -> main"
      ci:
        workflow: build-and-sign
        commit: "Configure cosign signing key"
        conclusion: success

  # The agent session only starts in the Agent terminal (`when.terminal`). Run
  # `sbx run claude` in the Host terminal and it falls through to the unmatched default.
  - id: start-agent
    when:
      command: [sbx, run, claude]
      terminal: agent
    then:
      output:
        - "Launching agent (simulated)…"
      session:
        intro:
          - "Ask me to scaffold the app, then type /exit to leave."
        prompt: "agent> "
        outro:
          - "Leaving the agent session."

  # A scripted agent turn that writes into the SHARED filesystem — so the Host
  # terminal can immediately `cat` the file the agent just created.
  - id: scaffold
    when:
      agent: true
      terminal: agent
      promptContains: ["scaffold"]
    then:
      output:
        - "Created app/server.js — a minimal Express server listening on :3000."
      files:
        - create: app/server.js
          content: |
            const express = require("express");
            const app = express();

            app.get("/", (_, res) => res.send("Hello from the agent!"));

            app.listen(3000, () => console.log("listening on :3000"));

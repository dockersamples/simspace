version: "1.0"

metadata:
  id: governance-mcp
  title: "Governance & MCP"
  summary: "See how org policy — approvals, MCP permissions, and network egress — gates an agent run, then unblock it step by step."
  authors: ["Michael Irwin"]

compatibility:
  simulator: ">=1.0 <2.0"

objectives:
  - "Read the current governance posture with `sbx policy ls`"
  - "Grant agent approval, enable an MCP server, and allow network egress"
  - "Watch an agent call an MCP tool once policy permits it"

# The lab starts locked down: agents need approval, no MCP server is enabled,
# and network egress is denied. The learner opens each gate in turn.
state:
  organization:
    approvalRequired: true
  mcp:
    enabled: false
  network:
    allowed: false
  phase: locked-down

defaults:
  unmatched:
    stderr: ["Error: that command isn't part of this lab yet."]
    exit: 1

scenarios:
  # --- inspect current policy -------------------------------------------------
  - id: policy-ls
    when:
      command: [policy, ls]
    then:
      output:
        - "POLICY                 VALUE"
        - "agent.approvalRequired {{ state.organization.approvalRequired }}"
        - "mcp.enabled            {{ state.mcp.enabled }}"
        - "network.egress         {{ state.network.allowed }}"

  # --- grant approval ---------------------------------------------------------
  - id: approve-agent
    when:
      command: [policy, approve, agent]
      state: { organization.approvalRequired: true }
    then:
      state:
        organization.approvalRequired: false
        phase: approved
      output:
        - "Approval granted. Agents may now run in this sandbox."

  - id: approve-agent-noop
    when:
      command: [policy, approve, agent]
    then:
      output:
        - "Agents are already approved to run."

  # --- enable the github MCP server ------------------------------------------
  - id: allow-mcp-github
    when:
      command: [policy, allow, mcp]
      args: { 0: "github" }
    then:
      state:
        mcp.enabled: true
      output:
        - "MCP server 'github' enabled for this sandbox."

  # --- allow network egress to the github api --------------------------------
  - id: allow-network
    when:
      command: [policy, allow, network]
      args: { 0: "api.github.com" }
    then:
      state:
        network.allowed: true
      output:
        - "Network egress to 'api.github.com' allowed."

  # --- the guided agent run, gated by each policy in turn --------------------
  # Ordered most-restrictive first so the first unmet gate is what the learner
  # sees. Approval is checked before MCP, which is checked before network.
  - id: agent-needs-approval
    when:
      command: [agent, run]
      state: { organization.approvalRequired: true }
    then:
      stderr:
        - "Error: running an agent requires organization approval."
        - "Grant it with: sbx policy approve agent"
      exit: 1

  - id: agent-mcp-blocked
    when:
      command: [agent, run]
      prompt: "Find Docker Sandbox repositories"
      state: { mcp.enabled: false }
    then:
      output:
        - "Agent: I need to search GitHub for that."
      stderr:
        - "Blocked: MCP tool 'github.search' is not permitted (no MCP server enabled)."
        - "Enable one with: sbx policy allow mcp github"
      exit: 1

  - id: agent-network-blocked
    when:
      command: [agent, run]
      prompt: "Find Docker Sandbox repositories"
      state:
        mcp.enabled: true
        network.allowed: false
    then:
      output:
        - "Agent: Calling the github MCP server..."
      stderr:
        - "Blocked: network egress to 'api.github.com' denied by policy."
        - "Allow it with: sbx policy allow network api.github.com"
      exit: 1

  - id: agent-success
    when:
      command: [agent, run]
      prompt: "Find Docker Sandbox repositories"
      state:
        mcp.enabled: true
        network.allowed: true
    then:
      output:
        - "Agent: Searching GitHub for Docker Sandbox repositories..."
      mcp:
        - tool: "github.search"
          arguments:
            query: "docker sandbox"
          result: |
            3 repositories found:
              - dockersamples/sandbox-demo
              - docker/sandbox
              - docker/sandbox-cli
      files:
        - create: "findings/repositories.md"
          content: |
            # Docker Sandbox repositories

            - dockersamples/sandbox-demo
            - docker/sandbox
            - docker/sandbox-cli
      state:
        phase: done

  # Any other agent prompt once unblocked.
  - id: agent-unknown-prompt
    when:
      command: [agent, run]
    then:
      output:
        - "Agent: I don't know how to help with that in this lab."

version: "1.1"

metadata:
  id: interactive-agent
  title: "Working with the Agent"
  summary: "Start a sandbox, drop into an agent session, and ask the agent to build features into a small app."
  authors: ["Michael Irwin"]

compatibility:
  simulator: ">=1.1 <2.0"

objectives:
  - "Start a sandbox and agent with `sbx run`"
  - "Ask the agent to add a health endpoint"
  - "Ask the agent to add tests"

state:
  sandbox:
    running: false
  app:
    hasHealth: false
    hasTests: false
  phase: start

defaults:
  unmatchedAgent:
    output:
      - "Agent: I can add a /health endpoint or add tests. Try asking for one of those."

scenarios:
  # `sbx run` starts the sandbox + agent and enters an interactive session.
  - id: run
    when:
      command: run
      state: { sandbox.running: false }
    then:
      output:
        - "Starting sandbox..."
        - "Sandbox is running. Launching agent..."
      files:
        - create: "app/server.js"
          content: |
            const express = require('express');
            const app = express();
            app.get('/', (_, res) => res.send('hello'));
            app.listen(3000);
      state:
        sandbox.running: true
        phase: session
      session:
        prompt: "agent> "
        intro:
          - "Agent ready. Ask me to build something into app/server.js."
          - "Try: \"add a health endpoint\" or \"add tests\". Type /exit to quit."
        outro:
          - "Agent session ended. The sandbox is still running."

  # --- agent: add a health endpoint -----------------------------------------
  - id: agent-add-health
    when:
      agent: true
      promptContains: [health]
      state: { app.hasHealth: false }
    then:
      output:
        - "Agent: Adding a GET /health endpoint that returns 200..."
      files:
        - append: "app/server.js"
          content: "app.get('/health', (_, res) => res.sendStatus(200));\n"
      state:
        app.hasHealth: true

  - id: agent-health-exists
    when:
      agent: true
      promptContains: [health]
      state: { app.hasHealth: true }
    then:
      output:
        - "Agent: The /health endpoint is already in app/server.js."

  # --- agent: add tests ------------------------------------------------------
  - id: agent-add-tests
    when:
      agent: true
      promptContains: [test]
      state: { app.hasTests: false }
    then:
      output:
        - "Agent: Adding a test file at app/server.test.js..."
      files:
        - create: "app/server.test.js"
          content: |
            const request = require('supertest');
            // TODO: import the app and assert on routes
      state:
        app.hasTests: true

  - id: agent-tests-exist
    when:
      agent: true
      promptContains: [test]
      state: { app.hasTests: true }
    then:
      output:
        - "Agent: Tests already exist at app/server.test.js."

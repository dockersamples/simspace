version: "2.0"

metadata:
  id: my-lab
  title: "My Lab"
  summary: "Describe what this lab teaches."

# In-memory state. Scenarios read it in `when.state` and write it in `then.state`.
state:
  greeted: false

settings:
  pace:
    pull: 900   # simulated layer download

defaults:
  unmatched:
    stderr: ["Error: that command isn't part of this lab yet."]
    exit: 1

scenarios:
  # A plain command. `command:` is the leading tokens; trailing args are ignored
  # unless you match them with `args:`.
  - id: echo
    when:
      command: [echo]
    then:
      state: { greeted: true }
      output: ["Hello from your lab!"]

  # Capture a positional argument and template it into the output. `{{ args.0 }}`
  # is the first token after the command path.
  - id: docker-run
    when:
      command: [docker, run]
      args:
        0: { any: true }
    then:
      output:
        - "Unable to find image '{{ args.0 }}' locally"
        - { text: "latest: Pulling from library/{{ args.0 }}", delay: short }
        - { text: "a480a496...: Pull complete", delay: pull }
        - { text: "Status: Downloaded newer image for {{ args.0 }}", delay: short }
        - "Hello from Docker!"
